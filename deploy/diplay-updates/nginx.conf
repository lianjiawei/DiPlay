# Include inside the existing HTTPS server block.
location ^~ /diplay-updates/. { return 404; }
location ^~ /diplay-updates/ {
    alias /var/www/diplay-updates/;
    autoindex off;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET { deny all; }
}
